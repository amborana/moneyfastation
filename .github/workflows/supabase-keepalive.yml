name: Supabase keepalive

on:
  schedule:
    # 08:45 and 20:45 IST (03:15 and 15:15 UTC)
    - cron: "15 3,15 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supabase-keepalive.yml"

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: Read-only Supabase activity check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the dedicated keepalive row
        env:
          SUPABASE_URL: https://aoupsryzexkauzwccnpi.supabase.co
          SUPABASE_KEY: sb_publishable_iOQkkrS_gCKcslz1tsms4g_7xvdAbdl
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Accept: application/json" \
            "${SUPABASE_URL}/rest/v1/keepalive?id=eq.1&select=id")"
          echo "Supabase keepalive response: ${response}"
          if ! grep -q '"id":1' <<< "${response}"; then
            echo "Expected keepalive row was not returned." >&2
            exit 1
          fi
          echo "Supabase database read succeeded."
