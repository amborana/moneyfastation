function authView(){return `<div class="auth-screen"><div class="auth-card"><div class="mark big">L</div><div class="eyebrow">Private financial OS</div><h1>The Ledger</h1><p>One secure household. Every rupee. Every device. No financial data is preloaded.</p><div class="auth-tabs"><button class="auth-tab ${authMode==='login'?'active':''}" data-auth="login">Sign in</button><button class="auth-tab ${authMode==='signup'?'active':''}" data-auth="signup">Create account</button></div>${field('Email','authEmail','','email','autocomplete="email" placeholder="you@example.com"')}${field('Password','authPassword','','password','autocomplete="current-password" placeholder="••••••••"')}<button class="primary wide" id="authSubmit">${authMode==='login'?'Sign in':'Create account'}</button><div class="auth-status" id="authStatus"></div><div class="auth-foot">Cloud sync is on · encrypted in transit · row-level access control</div></div></div>`}
function renderAuth(){document.getElementById('app').innerHTML=authView();document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>{authMode=b.dataset.auth;renderAuth()});document.getElementById('authSubmit').onclick=authSubmit}
async function authSubmit(){const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value;const s=document.getElementById('authStatus');if(!email||password.length<8){s.textContent='Enter a valid email and a password of at least 8 characters.';return}s.textContent='Working…';let r=authMode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password,options:{emailRedirectTo:location.href}});if(r.error){s.textContent=r.error.message;return}if(authMode==='signup'&&!r.data.session){s.textContent='Account created. Check your email to confirm it, then sign in.'}else if(r.data.session) await bootCloud(r.data.session.user)}
async function loadCloudContext(){const r=await sb.from('household_members').select('household_id,role').eq('user_id',cloud.user.id).maybeSingle();if(r.error)throw r.error;if(!r.data){cloud.member=null;cloud.household=null;return}cloud.member=r.data;const h=await sb.from('households').select('*').eq('id',r.data.household_id).single();if(h.error)throw h.error;cloud.household=h.data}
function onboarding(){document.getElementById('app').innerHTML=`<div class="auth-screen"><div class="auth-card"><div class="mark big">L</div><div class="eyebrow">Welcome to The Ledger</div><h1>Your household, your rules.</h1><p>Create a shared household or join an existing one with its invite code. The database starts completely empty.</p>${field('Your name','obName','','text','placeholder="Your name"')}${field('Household name','obHouse','','text','placeholder="Our Household"')}<button class="primary wide" id="createHouse">Create household</button><div class="divider">or join an existing household</div>${field('Invite code','obCode','','text','placeholder="AB12CD34EF"')}<button class="secondary wide" id="joinHouse">Join household</button><div class="auth-status" id="obStatus"></div></div></div>`;document.getElementById('createHouse').onclick=async()=>{await onboard('create')};document.getElementById('joinHouse').onclick=async()=>{await onboard('join')}}
async function onboard(mode){const status=document.getElementById('obStatus');status.textContent='Setting up…';try{const name=document.getElementById('obName').value.trim()||'User';let r;if(mode==='create')r=await sb.rpc('create_household',{p_name:document.getElementById('obHouse').value.trim()||'Our Household',p_display_name:name});else r=await sb.rpc('join_household',{p_invite_code:document.getElementById('obCode').value.trim(),p_display_name:name});if(r.error)throw r.error;await loadCloudContext();await loadCloudData();await materializeRecurring();await loadCloudData();cloud.ready=true;subscribeRealtime();render();toast(mode==='create'?'Household created':'Joined household')}catch(e){status.textContent=e.message||'Could not complete onboarding'}}
async function q(table,extra=''){let r=await sb.from(table).select('*').eq('household_id',cloud.household.id).order('created_at',{ascending:false});if(r.error)throw r.error;return r.data||[]}
async function loadCloudData(){if(!cloud.household)return;const [cats,subs,exps,inc,plans,inv,ic,rec,cc,goals,gc,assets,liab,subscrip,mb,yb,settings,members]=await Promise.all([q('categories'),q('subcategories'),q('expenses'),q('other_income'),q('plans'),q('investments'),q('investment_contributions'),q('recurring_items'),q('credit_card_bills'),q('goals'),q('goal_contributions'),q('assets'),q('liabilities'),q('subscriptions'),q('monthly_budgets'),q('yearly_budgets'),q('settings'),sb.from('household_members').select('user_id,role,profiles(display_name)').eq('household_id',cloud.household.id).then(x=>x.error?Promise.reject(x.error):x.data||[])]);state.categories=cats;state.subcategories=subs;state.expenses=exps;state.income=inc;state.plans=plans;state.investments=inv;state.investmentContributions=ic;state.recurring=rec;state.bills=cc;state.goals=goals;state.goalContributions=gc;state.assets=assets;state.liabilities=liab;state.subscriptions=subscrip;state.monthlyBudgets=mb;state.yearlyBudgets=yb;state.settings=settings[0]||{};state.baseIncome=state.settings.base_income||{};state.members=members;}
async function materializeRecurring(){const m=thisMonth();for(const r of state.recurring.filter(x=>x.auto_add)){const exists=state.expenses.some(e=>e.recurring_id===r.id&&e.expense_date?.startsWith(m));if(exists)continue;const day=String(Math.min(28,Math.max(1,Number(r.day||1)))).padStart(2,'0');const cat=state.categories.find(c=>c.id===r.category_id);if(!cat)continue;const rr=await sb.from('expenses').insert({id:uid(),household_id:cloud.household.id,category_id:r.category_id,subcategory_id:null,amount:r.amount,expense_date:`${m}-${day}`,note:r.label,added_by_name:'Auto',payment_method:r.payment_method||'',recurring_id:r.id,created_by:cloud.user.id});if(rr.error)throw rr.error}}
function subscribeRealtime(){if(!cloud.household)return;sb.removeAllChannels();['categories','subcategories','monthly_budgets','yearly_budgets','expenses','other_income','plans','investments','investment_contributions','recurring_items','credit_card_bills','goals','goal_contributions','assets','liabilities','subscriptions'].forEach(t=>sb.channel('ledger-'+t).on('postgres_changes',{event:'*',schema:'public',table:t,filter:'household_id=eq.'+cloud.household.id},async()=>{try{await loadCloudData();render()}catch(e){console.error(e)}}).subscribe())}
async function upsert(table,row){const r=await sb.from(table).upsert(row);if(r.error)throw r.error;await loadCloudData();render()}
async function remove(table,id){if(!confirm('Delete this item? This cannot be undone.'))return;const r=await sb.from(table).delete().eq('id',id).eq('household_id',cloud.household.id);if(r.error)throw r.error;await loadCloudData();render();toast('Deleted')}
function render(){if(!cloud.ready){renderAuth();return}document.getElementById('app').innerHTML=`<aside class="sidebar ${mobile?'open':''}"><div class="brand"><div class="mark">L</div><div><div class="brand-title">The Ledger</div><div class="brand-sub">Financial OS</div></div></div><div class="house"><span class="dot"></span>${esc(cloud.household.name)} · ${esc(activeName())}</div><nav class="nav">${nav.map(([n,ic])=>`<button class="${page===n?'active':''}" data-page="${n}">${I(ic)}<span>${n}</span>${n==='Copilot'?'<span class="badge">AI</span>':''}</button>`).join('')}</nav><div class="side-bottom"><nav class="nav"><button class="${page==='Settings'?'active':''}" data-page="Settings">${I('settings')}<span>Settings</span></button></nav><div class="privacy">${I('shield')} Private by design</div></div></aside><main class="main"><header class="topbar"><button class="menu" id="menu">${I('menu')}</button><div class="crumb"><span>Household</span>${I('arrow')}<strong>${page}</strong></div><div class="actions"><button class="search" id="search">${I('search')} Search <kbd>⌘ K</kbd></button><button class="ask" id="ask">${I('spark')} Ask Ledger</button><button class="avatar">${esc((activeName()||'L')[0].toUpperCase())}</button></div></header><section class="content">${pageView()}</section></main>`;wirePage()}
function activeName(){return state.members.find(m=>m.user_id===cloud.user.id)?.profiles?.display_name||'You'}
function pageView(){switch(page){case'History':return historyPage();case'Transactions':return transactions();case'Cash Flow':return cashflow();case'Budgets':return budgets();case'Future':return future();case'Investments':return investments();case'Net Worth':return networth();case'Goals':return goals();case'Bills':return bills();case'Analytics':return analytics();case'Categories':return categoriesPage();case'Copilot':return copilot();case'Settings':return settings();default:return overview()}}
function sum(a,fn){return a.reduce((s,x)=>s+Number(fn(x)||0),0)}
function overview(){const m=thisMonth(),ex=state.expenses.filter(x=>x.expense_date?.startsWith(m)),inc=state.income.filter(x=>x.income_date?.startsWith(m)),sp=sum(ex,x=>x.amount),income=sum(inc,x=>x.amount),assets=sum(state.assets,x=>x.current_value)+sum(state.investments,x=>x.starting_value)+sum(state.investmentContributions,x=>x.amount),liab=sum(state.liabilities,x=>x.balance),nw=assets-liab;return `<div class="hero"><div><div class="eyebrow">${monthLabel(m)} · cloud synced</div><h1>Your money, beautifully organized.</h1><p>Every original Ledger workflow is preserved: transactions, categories, subcategories, notes, budgets, plans, recurring items, credit cards, investments, goals and wealth.</p></div><button class="primary" id="addExpense">${I('plus')} Add transaction</button></div><div class="stat-grid"><article class="card stat"><div class="stat-head"><span>Net worth</span>${I('landmark')}</div><div class="number">₹${money(nw)}</div><div class="sub">assets + investments − liabilities</div></article><article class="card stat"><div class="stat-head"><span>Monthly cash flow</span>${I('chart')}</div><div class="number">₹${money(income-sp)}</div><div class="sub">₹${money(income)} income · ₹${money(sp)} spending</div></article><article class="card stat"><div class="stat-head"><span>Investments</span>${I('trend')}</div><div class="number">₹${money(sum(state.investments,x=>x.starting_value)+sum(state.investmentContributions,x=>x.amount))}</div><div class="sub">${state.investments.length} holdings · ${state.investmentContributions.length} contributions</div></article><article class="card stat"><div class="stat-head"><span>Upcoming</span>${I('calendar')}</div><div class="number">${state.bills.filter(x=>!x.paid).length+state.plans.length+state.goals.filter(x=>x.status==='active').length}</div><div class="sub">bills · plans · goals</div></article></div><div class="grid2"><section class="card panel"><div class="panel-head"><div><h2>Six-month spending</h2><div class="panel-desc">Synced household expense history</div></div></div>${lineChart()}</section><section class="card panel"><div class="panel-head"><div><h2>Top categories</h2><div class="panel-desc">This month</div></div></div>${categoryBreakdown(ex)}</section></div><div class="grid3"><section class="card panel compact"><div class="panel-head"><div><h2>Coming up</h2><div class="panel-desc">Bills and future plans</div></div>${I('calendar')}</div>${futureMini()}</section><section class="card panel compact"><div class="panel-head"><div><h2>Goals</h2><div class="panel-desc">Progress</div></div>${I('target')}</div>${goalMini()}</section><section class="card panel compact ai"><div class="spark">${I('spark')}</div><h2>Ask Ledger</h2><p>Copilot is ready for read-only analysis. Connect an OpenAI API key through a server-side Edge Function before enabling AI writes.</p><button class="dark" id="openCopilot">Open Copilot ${I('arrow')}</button></section></div>`}
function lineChart(){const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);months.push(d.toISOString().slice(0,7))}const vals=months.map(m=>sum(state.expenses.filter(x=>x.expense_date?.startsWith(m)),x=>x.amount));const max=Math.max(...vals,1),pts=vals.map((v,i)=>`${30+i*110},${205-(v/max)*155}`).join(' ');return `<div class="chart"><svg viewBox="0 0 600 250" preserveAspectRatio="none"><path class="gridline" d="M30 50H580M30 100H580M30 150H580M30 205H580"/><polyline class="line" points="${pts}"/>${months.map((m,i)=>`<text class="axis" x="${25+i*110}" y="239">${new Date(`${m}-01`).toLocaleDateString('en-IN',{month:'short'})}</text>`).join('')}</svg>${state.expenses.length?'':'<div class="empty-overlay"><div class="empty-icon">'+I('chart')+'</div><b>Your chart will come alive here</b><span>Add transactions to build history.</span></div>'}</div>`}
function categoryBreakdown(ex){const map={};ex.forEach(x=>{map[x.category_id]=(map[x.category_id]||0)+Number(x.amount||0)});const rows=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);if(!rows.length)return `<div class="empty"><div class="empty-icon">${I('chart')}</div><b>No spending yet</b><span>Add a transaction with a category.</span></div>`;const total=sum(rows,x=>x[1]);return rows.map(([id,v])=>{const c=state.categories.find(x=>x.id===id);return `<div class="mini-stat"><span>${esc(c?.name||'Uncategorized')}</span><b>₹${money(v)} · ${Math.round(v/total*100)}%</b></div>`}).join('')}
function futureMini(){const all=[...state.bills.filter(x=>!x.paid).map(x=>({date:x.due_date,name:x.card_name,amount:x.amount})),...state.plans.map(x=>({date:x.target_month,name:x.title,amount:x.target_amount}))].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,4);if(!all.length)return `<div class="empty"><div class="empty-icon">${I('calendar')}</div><b>Nothing here yet</b><span>Add a future plan or credit-card bill.</span><button class="linkbtn" data-page="Future">Plan something ${I('arrow')}</button></div>`;return all.map(x=>`<div class="mini-stat"><span>${esc(x.date||'—')} · ${esc(x.name)}</span><b>₹${money(x.amount)}</b></div>`).join('')}
function goalMini(){if(!state.goals.length)return `<div class="empty"><div class="empty-icon">${I('target')}</div><b>Nothing here yet</b><span>Create a goal and track contributions.</span><button class="linkbtn" data-page="Goals">Create goal ${I('arrow')}</button></div>`;return state.goals.slice(0,4).map(x=>{const saved=sum(state.goalContributions.filter(c=>c.goal_id===x.id),c=>c.amount)+(Number(x.saved_amount)||0);return `<div class="mini-stat"><span>${esc(x.name)}</span><b>${Math.min(100,Math.round(saved/(Number(x.target_amount)||1)*100))}%</b></div>`}).join('')}
function historyPage(){const months=new Set(state.expenses.map(x=>x.expense_date?.slice(0,7)).filter(Boolean));state.income.forEach(x=>x.income_date&&months.add(x.income_date.slice(0,7)));months.add(thisMonth());const ms=[...months].sort().reverse();return `<div class="hero"><div><div class="eyebrow">Original Ledger history</div><h1>History</h1><p>Jump between every month that contains recorded income or expenses.</p></div><input class="month" id="historyMonth" type="month" value="${selectedMonth}"></div><section class="card table-card"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Category</th><th>Subcategory</th><th>Person</th><th>Payment</th><th>Amount</th><th></th></tr></thead><tbody>${historyRows(selectedMonth)}</tbody></table></section><div class="note" style="margin-top:10px">Months with data: ${ms.map(m=>`<button class="linkbtn" data-history-month="${m}">${monthLabel(m)}</button>`).join(' ')}</div>`}
function historyRows(m){let rows=[...state.expenses.filter(x=>x.expense_date?.startsWith(m)).map(x=>({...x,_type:'Expense',date:x.expense_date})),...state.income.filter(x=>x.income_date?.startsWith(m)).map(x=>({...x,_type:'Income',date:x.income_date}))].sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(!rows.length)return `<tr><td colspan="9"><div class="large-empty"><div class="empty-icon">${I('calendar')}</div><h2>No entries for ${monthLabel(m)}.</h2><p>Add transactions to build your history.</p></div></td></tr>`;return rows.map(x=>{const c=state.categories.find(c=>c.id===x.category_id),sc=state.subcategories.find(s=>s.id===x.subcategory_id);return `<tr><td>${esc(x.date)}</td><td><span class="pill ${x._type==='Income'?'':'gold'}">${x._type}</span></td><td>${esc(x.note||x.label||'Transaction')}</td><td>${esc(c?.name||'—')}</td><td>${esc(sc?.name||'—')}</td><td>${esc(x.added_by_name||x.received_by_name||'—')}</td><td>${esc(x.payment_method||'—')}</td><td style="font-family:'IBM Plex Mono';color:${x._type==='Income'?'var(--mint)':'#d8aaa3'}">${x._type==='Income'?'+':'−'}₹${money(x.amount)}</td><td>${x._type==='Expense'?`<button class="linkbtn" data-del-exp="${x.id}">Delete</button>`:`<button class="linkbtn" data-del-inc="${x.id}">Delete</button>`}</td></tr>`}).join('')}
function transactions(){return `<div class="hero"><div><div class="eyebrow">Money in motion</div><h1>Transactions</h1><p>Category, subcategory, amount, payment method, person, plan link and notes are all retained.</p></div><button class="primary" id="addExpense">${I('plus')} Add transaction</button></div><div class="toolbar"><input id="txSearch" placeholder="Search merchant, note, category, person…"><select id="txType"><option value="all">All transactions</option><option value="expense">Expenses</option><option value="income">Income</option></select><input id="txMonth" type="month" value="${thisMonth()}"><button class="secondary" id="importBtn">${I('upload')} Import CSV</button><button class="secondary" id="exportBtn">Export CSV</button></div><section class="card table-card"><table class="table"><thead><tr><th>Date</th><th>Type</th><th>Description / Note</th><th>Category</th><th>Subcategory</th><th>Person</th><th>Payment</th><th>Amount</th><th></th></tr></thead><tbody id="txBody">${txRows()}</tbody></table></section>`}
function txRows(){const q=(document.getElementById('txSearch')?.value||'').toLowerCase(),type=document.getElementById('txType')?.value||'all',m=document.getElementById('txMonth')?.value||'';let rows=[...state.expenses.map(x=>({...x,_type:'Expense',date:x.expense_date})),...state.income.map(x=>({...x,_type:'Income',date:x.income_date}))].filter(x=>(type==='all'||x._type.toLowerCase()===type)&&(!m||x.date?.startsWith(m))).filter(x=>JSON.stringify(x).toLowerCase().includes(q)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(!rows.length)return `<tr><td colspan="9"><div class="large-empty"><div class="empty-icon">${I('receipt')}</div><h2>No transactions yet.</h2><p>Your history is intentionally empty. Add a transaction or import a CSV.</p></div></td></tr>`;return rows.map(x=>{const c=state.categories.find(c=>c.id===x.category_id),sc=state.subcategories.find(s=>s.id===x.subcategory_id);return `<tr><td>${esc(x.date)}</td><td><span class="pill ${x._type==='Income'?'':'gold'}">${x._type}</span></td><td>${esc(x.note||x.label||'Transaction')}</td><td>${esc(c?.name||'—')}</td><td>${esc(sc?.name||'—')}</td><td>${esc(x.added_by_name||x.received_by_name||'—')}</td><td>${esc(x.payment_method||'—')}</td><td style="font-family:'IBM Plex Mono';color:${x._type==='Income'?'var(--mint)':'#d8aaa3'}">${x._type==='Income'?'+':'−'}₹${money(x.amount)}</td><td>${x._type==='Expense'?`<button class="linkbtn" data-del-exp="${x.id}">Delete</button>`:`<button class="linkbtn" data-del-inc="${x.id}">Delete</button>`}</td></tr>`}).join('')}
function addExpense(){const cats=state.categories.map(c=>({value:c.id,label:c.name+(c.period==='yearly'?' · yearly':'' )}));const members=state.members.map(m=>({value:m.profiles?.display_name||m.user_id,label:m.profiles?.display_name||'Member'}));modal('Add transaction',`<div class="form-grid">${selectField('Type','fType',[{value:'expense',label:'Expense'},{value:'income',label:'Income'}],'expense')}${field('Amount','fAmount','','number','min="0.01" step="0.01" placeholder="0.00"')}${field('Date','fDate',today(),'date')}${selectField('Category','fCat',cats)}${selectField('Subcategory','fSub',[])}${selectField('Person','fPerson',members,{value:activeName(),label:activeName()})}${selectField('Payment method','fPay',['UPI','Cash','Card','Credit Card','Bank Transfer','Other'].map(x=>({value:x,label:x})))}${selectField('Link to plan','fPlan',[{value:'',label:'None'},...state.plans.map(p=>({value:p.id,label:p.title}))])}<div class="field full"><label>Note / merchant</label><textarea id="fNote" placeholder="Merchant, reason, or anything you want to remember"></textarea></div></div>`,async()=>{const type=document.getElementById('fType').value,amount=Number(document.getElementById('fAmount').value),date=document.getElementById('fDate').value;if(!amount||!date)throw Error('Amount and date are required');if(type==='income'){await upsert('other_income',{id:uid(),household_id:cloud.household.id,label:document.getElementById('fNote').value.trim()||'Income',amount,income_date:date,received_by_name:document.getElementById('fPerson').value||activeName(),created_by:cloud.user.id})}else{const cat=document.getElementById('fCat').value;if(!cat)throw Error('Category is required for expenses');await upsert('expenses',{id:uid(),household_id:cloud.household.id,category_id:cat,subcategory_id:document.getElementById('fSub').value||null,amount,expense_date:date,note:document.getElementById('fNote').value.trim(),added_by_name:document.getElementById('fPerson').value||activeName(),payment_method:document.getElementById('fPay').value,plan_id:document.getElementById('fPlan').value||null,created_by:cloud.user.id})}closeModal();toast('Transaction synced')});setTimeout(()=>{const cat=document.getElementById('fCat'),sub=document.getElementById('fSub');const fill=()=>{sub.innerHTML='<option value="">None</option>'+state.subcategories.filter(s=>s.category_id===cat.value).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')};cat.onchange=fill;document.getElementById('fType').onchange=()=>{document.getElementById('fCat').disabled=document.getElementById('fType').value==='income';document.getElementById('fSub').disabled=document.getElementById('fType').value==='income'}},0)}
function budgets(){const m=thisMonth(),mb=state.monthlyBudgets.find(x=>x.month===m)||{income_by_user:{},category_budgets:{}};return `<div class="hero"><div><div class="eyebrow">Plan the month</div><h1>Budgets</h1><p>Original monthly/yearly budgets, base income, other income, recurring items and credit-card bills.</p></div><button class="primary" id="addBudget">${I('plus')} Add budget</button></div><div class="grid2"><section class="card panel"><div class="panel-head"><div><h2>Monthly budget · ${monthLabel(m)}</h2><div class="panel-desc">Set income and category limits.</div></div></div><div class="actions-row"><button class="secondary" id="editMonthly">Edit monthly budget</button><button class="secondary" id="baseIncome">Base income</button><button class="secondary" id="otherIncome">Other income</button></div>${budgetRows(m,mb)}</section><section class="card panel"><div class="panel-head"><div><h2>Yearly budgets</h2><div class="panel-desc">${new Date().getFullYear()} category envelopes</div></div><button class="secondary" id="editYearly">Edit yearly</button></div>${yearlyRows()}</section></div><div class="grid2" style="margin-top:11px"><section class="card panel"><div class="panel-head"><div><h2>Recurring monthly items</h2><div class="panel-desc">Auto-log expenses on the selected day.</div></div><button class="secondary" id="addRecurring">Add recurring</button></div>${recurringRows()}</section><section class="card panel"><div class="panel-head"><div><h2>Credit card bills</h2><div class="panel-desc">Track due dates, amount, paid state and responsible person.</div></div><button class="secondary" id="addBill">Add bill</button></div>${billRows()}</section></div>`}
function budgetRows(m,mb){const rows=state.categories.filter(c=>c.period!=='yearly').map(c=>{const budget=Number(mb.category_budgets?.[c.id]||0),spent=sum(state.expenses.filter(e=>e.expense_date?.startsWith(m)&&e.category_id===c.id),e=>e.amount);return `<div class="mini-stat"><span>${esc(c.name)}</span><b>₹${money(spent)} / ₹${money(budget)}</b></div>`});return rows.length?rows.join(''):`<div class="empty"><b>No monthly categories yet</b><span>Create categories first.</span></div>`}
function yearlyRows(){const y=new Date().getFullYear(),yb=state.yearlyBudgets.find(x=>x.year===y)||{category_budgets:{}};const rows=state.categories.filter(c=>c.period==='yearly').map(c=>{const b=Number(yb.category_budgets?.[c.id]||0),s=sum(state.expenses.filter(e=>e.expense_date?.startsWith(String(y))&&e.category_id===c.id),e=>e.amount);return `<div class="mini-stat"><span>${esc(c.name)}</span><b>₹${money(s)} / ₹${money(b)}</b></div>`});return rows.length?rows.join(''):`<div class="empty"><b>No yearly categories yet</b><span>Mark a category as yearly in Categories.</span></div>`}
function recurringRows(){if(!state.recurring.length)return `<div class="empty"><b>No recurring items</b><span>Add rent, subscriptions or other repeat expenses.</span></div>`;return state.recurring.map(x=>`<div class="mini-stat"><span>${esc(x.label)} · day ${x.day}</span><b>₹${money(x.amount)} <button class="linkbtn" data-del-rec="${x.id}">Delete</button></b></div>`).join('')}
function billRows(){if(!state.bills.length)return `<div class="empty"><b>No credit-card bills</b><span>Add a bill to see due dates and payment status.</span></div>`;return state.bills.map(x=>`<div class="mini-stat"><span>${esc(x.card_name)} · ${esc(x.due_date)} ${x.paid?'· paid':''}</span><b>₹${money(x.amount)} <button class="linkbtn" data-toggle-bill="${x.id}">${x.paid?'Mark unpaid':'Mark paid'}</button></b></div>`).join('')}
function future(){return `<div class="hero"><div><div class="eyebrow">Intentional money</div><h1>Future</h1><p>Future plans are separate from actual transactions so you can plan without polluting history.</p></div><button class="primary" id="addFuture">${I('plus')} Add future plan</button></div><div class="page-grid"><section class="card module-card"><h3>Plans</h3>${state.plans.length?state.plans.map(p=>`<div class="mini-stat"><span>${esc(p.title)} · ${esc(p.target_month)}</span><b>₹${money(p.saved_so_far)} / ₹${money(p.target_amount)} <button class="linkbtn" data-contrib-plan="${p.id}">+</button> <button class="linkbtn" data-del-plan="${p.id}">Delete</button></b></div>`).join(''):`<div class="empty"><b>No future plans</b><span>Create a target for travel, a purchase, festival, etc.</span></div>`}</section><section class="card module-card"><h3>Calendar</h3>${calendarEvents()}</section><section class="card module-card"><h3>Subscriptions</h3>${subscriptionRows()}</section></div>`}
function calendarEvents(){const all=[...state.bills.map(x=>({d:x.due_date,t:x.card_name,a:x.amount})),...state.plans.map(x=>({d:x.target_month+'-01',t:x.title,a:x.target_amount}))].sort((a,b)=>a.d.localeCompare(b.d)).slice(0,8);return all.length?all.map(x=>`<div class="mini-stat"><span>${esc(x.d)} · ${esc(x.t)}</span><b>₹${money(x.a)}</b></div>`).join(''):`<div class="empty"><b>No scheduled events</b><span>Your future calendar will populate here.</span></div>`}
function subscriptionRows(){if(!state.subscriptions.length)return `<div class="empty"><b>No subscriptions</b><span>Add recurring subscriptions to track renewal dates.</span></div>`;return state.subscriptions.map(x=>`<div class="mini-stat"><span>${esc(x.name)} · ${esc(x.next_date||'—')}</span><b>₹${money(x.amount)} <button class="linkbtn" data-del-sub="${x.id}">Delete</button></b></div>`).join('')}
function investments(){return `<div class="hero"><div><div class="eyebrow">Long-term wealth</div><h1>Investments</h1><p>Holdings, owners, starting values and contribution history.</p></div><button class="primary" id="addInvestment">${I('plus')} Add investment</button></div><div class="stat-grid"><article class="card stat"><div class="stat-head"><span>Holdings</span>${I('trend')}</div><div class="number">${state.investments.length}</div><div class="sub">tracked investments</div></article><article class="card stat"><div class="stat-head"><span>Capital tracked</span>${I('wallet')}</div><div class="number">₹${money(sum(state.investments,x=>x.starting_value)+sum(state.investmentContributions,x=>x.amount))}</div><div class="sub">starting values + contributions</div></article></div><section class="card table-card"><table class="table"><thead><tr><th>Name</th><th>Type</th><th>Owner</th><th>Starting</th><th>Contributions</th><th>Notes</th><th></th></tr></thead><tbody>${state.investments.length?state.investments.map(x=>{const c=sum(state.investmentContributions.filter(i=>i.investment_id===x.id),i=>i.amount);return `<tr><td>${esc(x.name)}</td><td>${esc(x.type)}</td><td>${esc(x.owner_name)}</td><td>₹${money(x.starting_value)}</td><td>₹${money(c)} <button class="linkbtn" data-contrib-inv="${x.id}">Add</button></td><td>${esc(x.notes||'—')}</td><td><button class="linkbtn" data-del-inv="${x.id}">Delete</button></td></tr>`}).join(''):`<tr><td colspan="7"><div class="large-empty"><div class="empty-icon">${I('trend')}</div><h2>No investments yet.</h2><p>Add holdings and contribution history when you are ready.</p></div></td></tr>`}</tbody></table></section>`}
function networth(){const a=sum(state.assets,x=>x.current_value)+sum(state.investments,x=>x.starting_value)+sum(state.investmentContributions,x=>x.amount),l=sum(state.liabilities,x=>x.balance);return `<div class="hero"><div><div class="eyebrow">Balance sheet</div><h1>Net Worth</h1><p>Track assets, liabilities and investments separately from day-to-day cash flow.</p></div></div><div class="stat-grid"><article class="card stat"><div class="stat-head"><span>Total assets & investments</span>${I('landmark')}</div><div class="number">₹${money(a)}</div><div class="sub">${state.assets.length} assets · ${state.investments.length} holdings</div></article><article class="card stat"><div class="stat-head"><span>Liabilities</span>${I('card')}</div><div class="number">₹${money(l)}</div><div class="sub">${state.liabilities.length} liabilities</div></article><article class="card stat"><div class="stat-head"><span>Net worth</span>${I('trend')}</div><div class="number">₹${money(a-l)}</div><div class="sub">current recorded position</div></article></div><div class="grid2"><section class="card module-card"><h3>Assets <button class="linkbtn" id="addAsset">Add</button></h3>${state.assets.length?state.assets.map(x=>`<div class="mini-stat"><span>${esc(x.name)} · ${esc(x.owner_name)}</span><b>₹${money(x.current_value)} <button class="linkbtn" data-del-asset="${x.id}">Delete</button></b></div>`).join(''):`<div class="empty"><b>No assets</b><span>Add cash, property, gold or other assets.</span></div>`}</section><section class="card module-card"><h3>Liabilities <button class="linkbtn" id="addLiability">Add</button></h3>${state.liabilities.length?state.liabilities.map(x=>`<div class="mini-stat"><span>${esc(x.name)} · ${x.interest_rate?esc(x.interest_rate)+'%':''}</span><b>₹${money(x.balance)} <button class="linkbtn" data-del-liab="${x.id}">Delete</button></b></div>`).join(''):`<div class="empty"><b>No liabilities</b><span>Add loans, cards or other debt.</span></div>`}</section></div>`}
function goals(){return `<div class="hero"><div><div class="eyebrow">Targets</div><h1>Goals</h1><p>Create goals and record contributions without losing the history of each contribution.</p></div><button class="primary" id="addGoal">${I('plus')} Add goal</button></div><div class="page-grid">${state.goals.length?state.goals.map(x=>{const contrib=sum(state.goalContributions.filter(g=>g.goal_id===x.id),g=>g.amount),saved=Number(x.saved_amount||0)+contrib,pct=Math.min(100,Math.round(saved/(Number(x.target_amount)||1)*100));return `<section class="card module-card"><h3>${esc(x.name)}</h3><div class="note">${esc(x.owner_name||'Household')} · ${esc(x.target_date||'No date')}</div><div class="hero-metric">${pct}%</div><div class="progress"><i style="width:${pct}%"></i></div><div class="mini-stat"><span>Saved</span><b>₹${money(saved)} / ₹${money(x.target_amount)}</b></div><div class="actions-row"><button class="secondary" data-contrib-goal="${x.id}">Add contribution</button><button class="danger" data-del-goal="${x.id}">Delete</button></div></section>`}).join(''):`<section class="card module-card"><div class="large-empty"><div class="empty-icon">${I('target')}</div><h2>No goals yet.</h2><p>Create your first financial goal.</p></div></section>`}</div>`}
function bills(){return `<div class="hero"><div><div class="eyebrow">Due dates</div><h1>Bills</h1><p>Credit-card bills plus subscriptions, with paid/unpaid state.</p></div><button class="primary" id="addBill">${I('plus')} Add credit-card bill</button></div><section class="card table-card"><table class="table"><thead><tr><th>Card</th><th>Amount</th><th>Due</th><th>Responsible</th><th>Status</th><th></th></tr></thead><tbody>${state.bills.length?state.bills.map(x=>`<tr><td>${esc(x.card_name)}</td><td>₹${money(x.amount)}</td><td>${esc(x.due_date)}</td><td>${esc(x.responsible_name)}</td><td><span class="pill ${x.paid?'':'gold'}">${x.paid?'Paid':'Open'}</span></td><td><button class="linkbtn" data-toggle-bill="${x.id}">${x.paid?'Mark unpaid':'Mark paid'}</button> <button class="linkbtn" data-del-bill="${x.id}">Delete</button></td></tr>`).join(''):`<tr><td colspan="6"><div class="large-empty"><div class="empty-icon">${I('card')}</div><h2>No bills yet.</h2><p>Add your credit-card statement amount and due date.</p></div></td></tr>`}</tbody></table></section>`}
function analytics(){const m=thisMonth(),ex=state.expenses.filter(x=>x.expense_date?.startsWith(m));const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);months.push(d.toISOString().slice(0,7))}const vals=months.map(mm=>sum(state.expenses.filter(x=>x.expense_date?.startsWith(mm)),x=>x.amount));const max=Math.max(...vals,1);const pts=vals.map((v,i)=>`${30+i*110},${205-(v/max)*155}`).join(' ');const catMap={};ex.forEach(x=>catMap[x.category_id]=(catMap[x.category_id]||0)+Number(x.amount||0));const catRows=Object.entries(catMap).sort((a,b)=>b[1]-a[1]).slice(0,8);const total=sum(catRows,x=>x[1]);return `<div class="hero"><div><div class="eyebrow">Household intelligence</div><h1>Analytics</h1><p>Original Ledger breakdowns plus richer cloud-backed views.</p></div></div><div class="grid2"><section class="card module-card"><h3>By person</h3>${state.members.map(m=>{const n=m.profiles?.display_name||'Member',v=sum(ex.filter(x=>x.added_by_name===n),x=>x.amount);return `<div class="mini-stat"><span>${esc(n)}</span><b>₹${money(v)}</b></div>`}).join('')||'<div class="empty"><b>No members</b></div>'}</section><section class="card module-card"><h3>Payment method</h3>${['UPI','Cash','Card','Credit Card','Bank Transfer','Other'].map(p=>{const v=sum(ex.filter(x=>x.payment_method===p),x=>x.amount);return v?`<div class="mini-stat"><span>${p}</span><b>₹${money(v)}</b></div>`:''}).join('')||'<div class="empty"><b>No payment data</b></div>'}</section></div><section class="card panel" style="margin-top:11px"><h2>Top categories · this month</h2>${categoryBreakdown(ex)}</section>`}
function categoriesPage(){return `<div class="hero"><div><div class="eyebrow">Taxonomy</div><h1>Categories & Subcategories</h1><p>Keep the original Ledger hierarchy. Categories can be monthly or yearly; subcategories stay attached to their parent.</p></div><button class="primary" id="addCategory">${I('plus')} Add category</button></div><div class="page-grid">${state.categories.length?state.categories.map(c=>`<section class="card module-card"><div class="panel-head"><div><h3>${esc(c.name)}</h3><div class="note">${c.period==='yearly'?'Yearly':'Monthly'}</div></div><button class="linkbtn" data-add-sub="${c.id}">+ Subcategory</button></div>${state.subcategories.filter(s=>s.category_id===c.id).map(s=>`<div class="mini-stat"><span>${esc(s.name)}</span><button class="linkbtn" data-del-sub="${s.id}">Delete</button></div>`).join('')||'<div class="note" style="margin-top:15px">No subcategories yet.</div>'}<div class="actions-row"><button class="secondary" data-toggle-cat="${c.id}">Switch to ${c.period==='yearly'?'monthly':'yearly'}</button><button class="danger" data-del-cat="${c.id}">Delete</button></div></section>`).join(''):`<section class="card module-card"><div class="large-empty"><div class="empty-icon">${I('target')}</div><h2>No categories yet.</h2><p>Nothing is pre-seeded. Create the taxonomy that matches your household.</p></div></section>`}</div>`}
function copilot(){return `<div class="hero"><div><div class="eyebrow">Private analysis</div><h1>Ledger Copilot</h1><p>Read-only financial analysis can run against this household. Production AI writes should go through a server-side Edge Function and explicit confirmation.</p></div></div><section class="card panel"><div class="copilot-hero"><div class="spark">${I('spark')}</div><h3>Secure architecture</h3><p>The browser never receives an OpenAI secret. The intended production path is authenticated client → Supabase Edge Function → OpenAI Responses API, with household-scoped data and confirmation for writes.</p></div><div class="chips"><button class="chip" data-ai="cash">Review my cash flow</button><button class="chip" data-ai="spend">Where did I spend most?</button><button class="chip" data-ai="upcoming">What is coming up?</button><button class="chip" data-ai="goals">Review my goals</button></div><div class="field" style="margin-top:13px"><label>Question</label><textarea id="aiQ" placeholder="Ask about the financial data you have entered…"></textarea></div><div class="actions-row"><button class="primary" id="copilotAsk">Analyze locally</button><span class="note">No API key is embedded in this app.</span></div><div id="aiAnswer" class="note" style="margin-top:14px"></div></section>`}
function settings(){return `<div class="hero"><div><div class="eyebrow">Control center</div><h1>Settings</h1><p>Household onboarding, backup, export and privacy controls.</p></div></div><div class="settings-grid"><section class="card setting"><h3>Household</h3><p>${esc(cloud.household.name)} · invite code <strong>${esc(cloud.household.invite_code)}</strong></p><p class="note">Share the invite code only with people you want inside this household.</p><div class="actions-row"><button class="secondary" id="copyInvite">Copy invite code</button></div></section><section class="card setting"><h3>Members</h3>${state.members.map(m=>`<div class="mini-stat"><span>${esc(m.profiles?.display_name||m.user_id)}</span><b>${esc(m.role)}</b></div>`).join('')}</section><section class="card setting"><h3>Backups</h3><p>Export a complete JSON backup of the current household. Restore is intentionally a guided operation rather than a silent overwrite.</p><div class="actions-row"><button class="secondary" id="exportJson">Export JSON</button><label class="secondary" style="cursor:pointer">Restore JSON<input id="importJson" type="file" accept="application/json" style="display:none"></label></div></section><section class="card setting"><h3>CSV</h3><p>Import/export transaction history with quoted CSV parsing, categories, subcategories, notes, people and payment methods.</p><div class="actions-row"><button class="secondary" id="exportBtn">Export transactions</button><button class="secondary" id="importBtn">Import transactions</button></div></section><section class="card setting"><h3>Session</h3><p>Sign out of this device. Supabase persists the session securely in the browser.</p><button class="secondary" id="signOut">Sign out</button></section><section class="card setting"><h3>Danger zone</h3><p>Delete all household financial data. This is irreversible and requires a second confirmation.</p><button class="danger" id="wipeCloud">Delete household data</button></section></div>`}
function cashflow(){const m=thisMonth(),income=sum(state.income.filter(x=>x.income_date?.startsWith(m)),x=>x.amount),spend=sum(state.expenses.filter(x=>x.expense_date?.startsWith(m)),x=>x.amount),bills=sum(state.bills.filter(x=>!x.paid),x=>x.amount),goals=sum(state.goals,x=>Math.max(0,Number(x.target_amount)-Number(x.saved_amount)-sum(state.goalContributions.filter(g=>g.goal_id===x.id),g=>g.amount)));return `<div class="hero"><div><div class="eyebrow">Past · present · future</div><h1>Cash Flow</h1><p>Recorded flow plus known commitments.</p></div></div><div class="stat-grid"><article class="card stat"><div class="stat-head"><span>Income</span>${I('trend')}</div><div class="number">₹${money(income)}</div><div class="sub">this month</div></article><article class="card stat"><div class="stat-head"><span>Spending</span>${I('receipt')}</div><div class="number">₹${money(spend)}</div><div class="sub">this month</div></article><article class="card stat"><div class="stat-head"><span>Open bills</span>${I('card')}</div><div class="number">₹${money(bills)}</div><div class="sub">not marked paid</div></article><article class="card stat"><div class="stat-head"><span>Goal gap</span>${I('target')}</div><div class="number">₹${money(goals)}</div><div class="sub">remaining target funding</div></article></div><section class="card panel"><h2>Cash-flow bridge</h2><div class="kpi"><div><b>₹${money(income-spend)}</b><span>Recorded net</span></div><div><b>₹${money(income-spend-bills)}</b><span>After open bills</span></div><div><b>₹${money(income-spend-bills-goals)}</b><span>After goal funding gap</span></div></div></section>`}
function editMonthly(){const m=thisMonth(),cur=state.monthlyBudgets.find(x=>x.month===m)||{income_by_user:{},category_budgets:{}};const cats=state.categories.filter(c=>c.period!=='yearly');const body=`<div class="form-grid">${cats.map(c=>field(c.name,'b_'+c.id,cur.category_budgets?.[c.id]||'', 'number','min="0" step="0.01"')).join('')}</div>`;modal('Monthly category budgets',body,async()=>{const cb={};cats.forEach(c=>cb[c.id]=Number(document.getElementById('b_'+c.id).value||0));await upsert('monthly_budgets',{household_id:cloud.household.id,month:m,income_by_user:cur.income_by_user||{},category_budgets:cb});closeModal();toast('Monthly budget saved')})}
function editYearly(){const y=new Date().getFullYear(),cur=state.yearlyBudgets.find(x=>x.year===y)||{category_budgets:{}};const cats=state.categories.filter(c=>c.period==='yearly');modal(`Yearly budgets · ${y}`,`<div class="form-grid">${cats.map(c=>field(c.name,'y_'+c.id,cur.category_budgets?.[c.id]||'', 'number','min="0" step="0.01"')).join('')}</div>`,async()=>{const cb={};cats.forEach(c=>cb[c.id]=Number(document.getElementById('y_'+c.id).value||0));await upsert('yearly_budgets',{household_id:cloud.household.id,year:y,category_budgets:cb});closeModal();toast('Yearly budget saved')})}
function baseIncome(){const members=state.members.map(m=>m.profiles?.display_name||m.user_id);modal('Base income',`<div class="form-grid">${members.map(n=>field(n,'bi_'+btoa(n).replace(/=/g,''),state.baseIncome?.[n]||'', 'number','min="0"')).join('')}</div>`,async()=>{const next={};members.forEach(n=>next[n]=Number(document.getElementById('bi_'+btoa(n).replace(/=/g,'')).value||0));await sb.from('settings').upsert({household_id:cloud.household.id,base_income:next});await loadCloudData();closeModal();render();toast('Base income saved')})}
function otherIncome(){modal('Other income',`<div class="form-grid">${field('Label','oiLabel','','text','placeholder="Bonus, gift, freelance…"')}${field('Amount','oiAmount','','number','min="0" step="0.01"')}${field('Date','oiDate',today(),'date')} ${field('Received by','oiBy',activeName())}</div>`,async()=>{await upsert('other_income',{id:uid(),household_id:cloud.household.id,label:document.getElementById('oiLabel').value.trim()||'Other income',amount:Number(document.getElementById('oiAmount').value||0),income_date:document.getElementById('oiDate').value,received_by_name:document.getElementById('oiBy').value.trim()||activeName(),created_by:cloud.user.id});closeModal();toast('Other income saved')})}
function addRecurring(){modal('Recurring monthly item',`<div class="form-grid">${field('Label','rLabel','','text','placeholder="Rent"')}${field('Amount','rAmount','','number','min="0" step="0.01"')}${selectField('Category','rCat',state.categories.map(c=>({value:c.id,label:c.name})))}${field('Day of month','rDay','1','number','min="1" max="28"')}${selectField('Payment method','rPay',['UPI','Cash','Card','Credit Card','Bank Transfer','Other'].map(x=>({value:x,label:x})))}<div class="field full"><label><input id="rAuto" type="checkbox" checked> Auto-log as an expense each month</label></div></div>`,async()=>{await upsert('recurring_items',{id:uid(),household_id:cloud.household.id,label:document.getElementById('rLabel').value.trim(),category_id:document.getElementById('rCat').value,amount:Number(document.getElementById('rAmount').value||0),auto_add:document.getElementById('rAuto').checked,day:Number(document.getElementById('rDay').value||1),payment_method:document.getElementById('rPay').value});closeModal();toast('Recurring item saved')})}

function csvParse(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i],nx=text[i+1];if(q&&ch==='"'&&nx==='"'){cell+='"';i++;continue}if(ch==='"'){q=!q;continue}if(ch===','&&!q){row.push(cell);cell='';continue}if((ch==='\n'||ch==='\r')&&!q){if(ch==='\r'&&nx==='\n')i++;row.push(cell);cell='';if(row.some(v=>v.trim()!==''))rows.push(row);row=[];continue}cell+=ch}row.push(cell);if(row.some(v=>v.trim()!==''))rows.push(row);return rows}
async function importCSV(){const inp=document.createElement('input');inp.type='file';inp.accept='.csv,text/csv';inp.onchange=async()=>{const f=inp.files?.[0];if(!f)return;const rows=csvParse(await f.text());if(rows.length<2)return toast('CSV is empty');const h=rows[0].map(x=>x.trim().toLowerCase());const ix=(...names)=>names.map(n=>h.indexOf(n)).find(i=>i>=0);const dateI=ix('date'),typeI=ix('type'),amtI=ix('amount'),catI=ix('category'),subI=ix('subcategory'),noteI=ix('note','merchant','description'),personI=ix('person','by'),payI=ix('payment method','paymentmethod');if(amtI==null||dateI==null)throw toast('CSV needs Date and Amount columns');const cats=[...state.categories],subs=[...state.subcategories];let added=0,skipped=0;for(const r of rows.slice(1)){const amount=Number(String(r[amtI]||'').replace(/[^0-9.-]/g,''));if(!amount||!r[dateI]){skipped++;continue}const type=(r[typeI]||'Expense').toLowerCase();if(type==='income'){const rr=await sb.from('other_income').insert({id:uid(),household_id:cloud.household.id,label:r[noteI]||'Imported income',amount,income_date:r[dateI],received_by_name:r[personI]||activeName(),created_by:cloud.user.id});if(rr.error)throw rr.error}else{let catName=(r[catI]||'').trim();let cat=cats.find(c=>c.name.toLowerCase()===catName.toLowerCase());if(!cat&&catName){cat={id:uid(),household_id:cloud.household.id,name:catName,period:'monthly'};const cr=await sb.from('categories').insert(cat);if(cr.error)throw cr.error;cats.push(cat)}if(!cat){skipped++;continue}let sub=null;const sn=(r[subI]||'').trim();if(sn){sub=subs.find(s=>s.category_id===cat.id&&s.name.toLowerCase()===sn.toLowerCase());if(!sub){sub={id:uid(),household_id:cloud.household.id,category_id:cat.id,name:sn};const sr=await sb.from('subcategories').insert(sub);if(sr.error)throw sr.error;subs.push(sub)}}const rr=await sb.from('expenses').insert({id:uid(),household_id:cloud.household.id,category_id:cat.id,subcategory_id:sub?.id||null,amount,expense_date:r[dateI],note:r[noteI]||'',added_by_name:r[personI]||activeName(),payment_method:r[payI]||'',created_by:cloud.user.id});if(rr.error)throw rr.error}added++}await loadCloudData();render();toast(`Imported ${added} rows${skipped?' · skipped '+skipped:''}`)};inp.click()}
function exportCSV(){const rows=[['Date','Type','Amount','Category','Subcategory','Note','Person','Payment Method']];state.expenses.forEach(x=>rows.push([x.expense_date,'Expense',x.amount,state.categories.find(c=>c.id===x.category_id)?.name||'',state.subcategories.find(s=>s.id===x.subcategory_id)?.name||'',x.note,x.added_by_name,x.payment_method]));state.income.forEach(x=>rows.push([x.income_date,'Income',x.amount,'','',x.label,x.received_by_name,'']));download(new Blob([rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n')],{type:'text/csv'}),'ledger-transactions.csv')}

async function openCopilot(){const q=document.getElementById('aiQ')?.value?.trim()||'';if(!q)return toast('Ask a question first');const ex=sum(state.expenses,x=>x.amount),inc=sum(state.income,x=>x.amount),openBills=sum(state.bills.filter(x=>!x.paid),x=>x.amount),top=Object.entries(state.expenses.reduce((a,x)=>{const n=state.categories.find(c=>c.id===x.category_id)?.name||'Uncategorized';a[n]=(a[n]||0)+Number(x.amount||0);return a},{})).sort((a,b)=>b[1]-a[1]).slice(0,3);document.getElementById('aiAnswer').textContent=`Local analysis: recorded income ₹${money(inc)}, spending ₹${money(ex)}, net ₹${money(inc-ex)}, open bills ₹${money(openBills)}. Top categories: ${top.map(x=>x[0]+' ₹'+money(x[1])).join(', ')||'none'}. Your question: ${q}.`}
